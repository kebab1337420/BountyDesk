appId: com.bountydesk.app
productName: Venari
copyright: Copyright © 2026 whitehat

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  synopsis: Bureau du chercheur Intigriti
  description: Venari - centralise vos programmes de bug bounty, vos scans de securite et vos agents IA.
  desktop:
    entry:
      Name: Venari
      Comment: Bureau du chercheur Intigriti
      Categories: Development;Security;
      StartupWMClass: Venari
      MimeType: x-scheme-handler/venari;

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Venari
  uninstallDisplayName: Venari
  artifactName: Venari-Setup-${version}.${ext}
  include: build/installer.nsh

npmRebuild: true